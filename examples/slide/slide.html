<!doctype html>
<meta charset="utf-8">
<title>.char in a slide</title>
<!-- A 16:9 HTML slide (works the same inside reveal.js, a custom deck, or an LMS iframe). Click the character to talk. -->
<script type="module" src="../../runtime/char-player.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #222; display: grid; place-items: center; }
  .slide { width: 1280px; height: 720px; background: linear-gradient(135deg, #fff8ec, #ffe9d2); position: relative; overflow: hidden;
           font-family: system-ui, sans-serif; border-radius: 6px; }
  h1 { position: absolute; left: 72px; top: 90px; width: 640px; font-size: 54px; line-height: 1.1; margin: 0; color: #2b1d14; }
  p  { position: absolute; left: 72px; top: 300px; width: 600px; font-size: 24px; color: #5a4636; }
  char-player { position: absolute; right: 40px; bottom: 0; width: 480px; height: 680px; }
  .tip { position: absolute; left: 72px; bottom: 48px; font-size: 15px; color: #8a7666; }
</style>
<div class="slide">
  <h1>Welcome to class!</h1>
  <p>Any character in <code>characters/</code> can present a slide. Swap the <code>src</code> and the voice line.</p>
  <char-player src="../../characters/bhasha.char" audio="../audio/bhasha-hello.mp3" track="../audio/bhasha-hello.lipsync.json"
               pose="explain" expression="excited" fit="body" width="720" height="1020"></char-player>
  <div class="tip">click the character ▸</div>
</div>
